schema_version: 1

services:
  - id: container-runtime
    host: docker-host
    protocol: local

  - id: example-application
    host: docker-host
    protocol: https
    public_hostname: app.example.com
    access: identity-aware-proxy

  - id: local-inference-api
    host: gpu-workstation
    protocol: http
    scope:
      - lan
    consumer: local-ai-ui

  - id: private-overlay
    host: network-node
    protocol: tailscale
    advertised_routes:
      - 192.168.x.x/24

  - id: file-sharing
    type: smb
    host: network-node
    protocol: smb
    scope:
      - lan
      - vpn

  - id: backup
    host: backup-server
    protocol: https
    status: planned
